<title>Vault Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a reviewer's desk. Sticky masthead with the vault and its last run, a tab rail, then
   one column of decision cards; each card puts the claim first and the controls last. */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --sunken: #eef1f6; --ink: #141a26; --muted: #5b6578;
  --line: #dce1ea; --accent: #e06400; --accent-ink: #ffffff; --blue: #4c6cb2; --blue-soft: #e8edf5;
  --good: #1d7f55; --good-soft: #e3f3ea; --warn: #9a6512; --warn-soft: #fbf0dc;
  --bad: #b8372f; --bad-soft: #fae6e4; --focus: #4c6cb2;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-label: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1117; --surface: #151b24; --sunken: #10151d; --ink: #e6eaf2; --muted: #8e99ad;
  --line: #273041; --accent: #ff7a1a; --accent-ink: #160b00; --blue: #8aa3dd; --blue-soft: #1b2436;
  --good: #47c58d; --good-soft: #12291f; --warn: #e3ac4c; --warn-soft: #2d2412;
  --bad: #f07067; --bad-soft: #321716; --focus: #8aa3dd; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #151b24; --sunken: #10151d; --ink: #e6eaf2; --muted: #8e99ad;
  --line: #273041; --accent: #ff7a1a; --accent-ink: #160b00; --blue: #8aa3dd; --blue-soft: #1b2436;
  --good: #47c58d; --good-soft: #12291f; --warn: #e3ac4c; --warn-soft: #2d2412;
  --bad: #f07067; --bad-soft: #321716; --focus: #8aa3dd; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.mast .wrap { padding-block: 14px 0; display: grid; gap: 10px; }
.mast-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.mast h1 { margin: 0; font: 600 20px/1.2 var(--f-body); text-wrap: balance; }
.mast .group { font: 12px var(--f-mono); color: var(--muted); }
.mast .runline { font-size: 13px; color: var(--muted); flex-basis: 100%; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
nav.tabs a { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px 10px; text-decoration: none; color: var(--muted); font: 600 13px var(--f-label); letter-spacing: .03em; text-transform: uppercase; border-bottom: 2px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.count { min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--sunken); color: var(--muted); font: 500 12px/18px var(--f-mono); text-align: center; }
.count.hot { background: var(--accent); color: var(--accent-ink); }

main.wrap { padding-block: 20px 48px; display: grid; gap: 18px; }
.banner { padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); font-size: 14px; }
.banner.info { background: var(--blue-soft); color: var(--blue); }
h2 { margin: 6px 0 0; font: 600 13px var(--f-label); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }
.empty { padding: 28px 20px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); display: grid; gap: 8px; }
.empty strong { color: var(--ink); font-weight: 600; }
.empty ol { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 4px; }

/* summary */
.strip { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.stat { display: grid; gap: 2px; }
.stat b { font: 500 24px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { font: 600 11px var(--f-label); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.todo { display: flex; flex-wrap: wrap; gap: 8px; }
.todo a { display: inline-flex; gap: 8px; align-items: center; padding: 6px 12px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); text-decoration: none; font-size: 14px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.panel h3 { margin: 0; font: 600 14px var(--f-body); }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.list li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; min-width: 0; }
.ladder { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; font-size: 13px; }
.ladder .cls { font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere; }
.rungs { display: inline-flex; gap: 3px; }
.rungs i { width: 18px; height: 8px; border-radius: 2px; background: var(--sunken); border: 1px solid var(--line); }
.rungs i.on { background: var(--blue); border-color: var(--blue); }
.spark { width: 100%; height: 56px; display: block; }
.note { font-size: 13px; color: var(--muted); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; min-width: 0; }
.card.flag-sev5 { border-left: 3px solid var(--accent); }
.card-body { padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 10px; background: var(--sunken); color: var(--muted); font: 600 11px/18px var(--f-label); letter-spacing: .04em; text-transform: uppercase; }
.chip.type { background: var(--blue-soft); color: var(--blue); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.sig { display: inline-flex; gap: 2px; align-items: center; }
.sig i { width: 7px; height: 12px; border-radius: 1px; background: var(--line); }
.sig i.on { background: var(--accent); }
.card h4 { margin: 0; font: 600 16px/1.35 var(--f-body); text-wrap: balance; overflow-wrap: anywhere; }
.claim { margin: 0; max-width: 72ch; }
.why { margin: 0; color: var(--muted); max-width: 72ch; font-size: 14px; }
.sources { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
.sources li { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; min-width: 0; }
.sources a { overflow-wrap: anywhere; }
.sources time, .mono { font: 12px var(--f-mono); color: var(--muted); }
.review { background: var(--sunken); border-radius: var(--r); padding: 8px 12px; font-size: 13px; display: grid; gap: 2px; }
.review b { font-weight: 600; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.side { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.side .lbl { font: 600 11px var(--f-label); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.diff { font: 13px/1.5 var(--f-mono); background: var(--sunken); border-radius: var(--r); padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.actions { border-top: 1px solid var(--line); padding: 10px 16px; display: grid; gap: 8px; background: var(--surface); border-radius: 0 0 var(--r) var(--r); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: 600 13px var(--f-body); padding: 7px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.good { color: var(--good); border-color: var(--good); }
button.bad { color: var(--bad); border-color: var(--bad); }
button.link { border: 0; background: none; padding: 7px 4px; color: var(--blue); }
textarea, input[type="text"], select { width: 100%; font: 14px/1.4 var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
textarea { min-height: 64px; resize: vertical; }
label.small { font: 600 11px var(--f-label); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); display: grid; gap: 4px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
details.charter { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.charter summary { padding: 10px 14px; cursor: pointer; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
details.charter pre { margin: 0; padding: 0 14px 14px; font: 13px/1.55 var(--f-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.md { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; max-height: 420px; overflow: auto; background: var(--sunken); border-radius: var(--r); padding: 10px 12px; }
.md.view { white-space: normal; }
.md.view > :first-child { margin-top: 0; }
.md.view > :last-child { margin-bottom: 0; }
.md.view h1, .md.view h2, .md.view h3, .md.view h4 { font: 600 15px/1.3 var(--f-body); letter-spacing: 0; text-transform: none; color: var(--ink); margin: 14px 0 6px; padding: 0; border: 0; }
.md.view p, .md.view ul, .md.view ol { margin: 0 0 8px; }
.md.view ul, .md.view ol { padding-left: 20px; }
.md.view code { font: 12.5px var(--f-mono); }
.md.view a { color: var(--blue); }
.count { font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 6px; }
.count.over { color: var(--bad); font-weight: 600; }
table.runs { width: 100%; border-collapse: collapse; font-size: 13px; }
table.runs th, table.runs td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.runs th { font: 600 11px var(--f-label); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
table.runs td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.toast { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: var(--r); background: var(--ink); color: var(--bg); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: opacity .15s; } }
/* settings */
.settings-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }
.sec-top { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px 18px; }
.field { display: grid; gap: 4px; align-content: start; min-width: 0; padding-left: 10px; border-left: 3px solid transparent; }
.field label { font-size: 13px; font-weight: 600; }
.field small { font-size: 12px; color: var(--muted); }
.field.changed { border-left-color: var(--accent); }
.field.invalid input, .field.invalid textarea { border-color: var(--bad); }
.field.invalid small b { color: var(--bad); font-weight: 600; }
.inrow { display: flex; align-items: center; gap: 6px; }
.inrow input[inputmode="numeric"] { max-width: 7em; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.unit { font-size: 13px; color: var(--muted); }
input:disabled, textarea:disabled, select:disabled { opacity: .7; cursor: not-allowed; }
h4.sub { margin: 6px 0 0; font: 600 13px var(--f-body); }
.savebar { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 4; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.savebar.live { border-color: var(--accent); box-shadow: 0 4px 16px rgba(0, 0, 0, .12); }
.changelog li { grid-template-columns: 3em 1fr; font-size: 14px; }
.changelog .chip { margin-left: 8px; }
/* inbox */
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters a { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); text-decoration: none; font-size: 13px; }
.filters a[aria-current="page"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
kbd { display: inline-block; margin-left: 6px; min-width: 16px; padding: 0 4px; border: 1px solid currentColor; border-radius: 3px; font: 500 10px/14px var(--f-mono); opacity: .55; text-align: center; }
@media (hover: none) { kbd, .keys { display: none; } }
.card:focus { outline: none; }
.card.cur { outline: 2px solid var(--focus); outline-offset: 2px; }
.card.hl { box-shadow: 0 0 0 3px var(--accent); }
.card.done .card-body { padding: 10px 16px; gap: 2px; }
.card.done .actions { padding: 4px 16px 8px; border-top: 0; }
.done-title { color: var(--ink); font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.review.blind { background: transparent; border: 1px dashed var(--line); }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.small-lbl { flex-basis: 100%; font-size: 12px; color: var(--muted); }
button.reason { border-radius: 16px; padding: 5px 12px; font-weight: 500; }
.btns.end { align-self: end; }
details.fold summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 2px 0 6px; }
.toast { display: flex; gap: 14px; align-items: center; }
.toast[hidden] { display: none; }
.toast button.link { color: inherit; text-decoration: underline; padding: 0 2px; }
@media (max-width: 640px) {
  .card .actions { position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 2; box-shadow: 0 -6px 12px -8px rgba(0, 0, 0, .25); }
  .actions .btns > button { flex: 1 1 auto; }
}
/* reviewer */
.classes { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.crow { display: grid; grid-template-columns: minmax(140px, 1.1fr) 110px minmax(220px, 2fr) minmax(110px, .8fr) minmax(130px, 1fr); gap: 8px 16px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: start; font-size: 13px; min-width: 0; }
.crow:first-child { border-top: 0; }
.crow.head { padding-block: 8px; font: 600 11px var(--f-label); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.crow > div { display: grid; gap: 4px; align-content: start; min-width: 0; }
.c-name b { font-weight: 600; overflow-wrap: anywhere; }
.c-stage .chip { justify-self: start; }
.c-wide { grid-column: 3 / -1; color: var(--muted); }
.lbl-m { display: none; }
.needs { display: grid; gap: 10px; }
.need { display: grid; gap: 3px; }
.need-top { display: flex; justify-content: space-between; gap: 8px; }
.need small { color: var(--muted); }
.bar { height: 6px; overflow: hidden; border-radius: 3px; background: var(--sunken); border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--blue); }
.need.earned .bar i { background: var(--good); }
b.ok { color: var(--good); font-weight: 600; }
b.short { color: var(--bad); font-weight: 600; }
.spark.small { height: 28px; max-width: 160px; }
.dis small { display: inline; }
@media (max-width: 760px) {
  .crow { grid-template-columns: minmax(0, 1fr) auto; }
  .crow.head { display: none; }
  .c-needs, .c-since, .c-wait, .c-wide { grid-column: 1 / -1; }
  .c-since, .c-wait { display: block !important; }
  .lbl-m { display: inline; font-weight: 600; color: var(--muted); }
}
</style>

<header class="mast">
  <div class="wrap">
    <div class="mast-top">
      <h1 id="vault-name">Vault Console</h1>
      <span class="group" id="vault-group"></span>
      <span class="runline" id="runline">Connecting to the Console data…</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Console sections"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script type="application/json" id="config-fields">
{
 "sections": [
  {
   "id": "run",
   "title": "Research run",
   "note": "Read by the research run. Applies at the next research run.",
   "fields": [
    {
     "key": "run.pending_cap",
     "label": "New rows per run",
     "kind": "int",
     "default": 25,
     "min": 5,
     "max": 50
    },
    {
     "key": "run.significance_floor",
     "label": "Drop findings below significance",
     "kind": "int",
     "default": 2,
     "min": 1,
     "max": 4
    },
    {
     "key": "run.scout_max_items",
     "label": "Items per scout",
     "kind": "int",
     "default": 8,
     "min": 3,
     "max": 15,
     "help": "A beat's own max in the charter can be lower, never higher."
    }
   ]
  },
  {
   "id": "review",
   "title": "Reviewer",
   "note": "Passed to the reviewer by the research run. Applies at the next research run.",
   "fields": [
    {
     "key": "review.precedents_min",
     "label": "Similar past calls needed",
     "kind": "int",
     "default": 5,
     "min": 3,
     "max": 20
    },
    {
     "key": "review.precedent_agreement",
     "label": "Past calls that must agree",
     "kind": "pct",
     "default": 0.9,
     "min": 0.8,
     "max": 1.0
    },
    {
     "key": "review.precedent_half_life_days",
     "label": "A past call counts half after",
     "kind": "days",
     "default": 60,
     "min": 14,
     "max": 365
    },
    {
     "key": "review.override_cooloff_days",
     "label": "No auto calls after an override for",
     "kind": "days",
     "default": 30,
     "min": 7,
     "max": 90
    },
    {
     "key": "review.recent_steering_days",
     "label": "Escalate rows touching steering newer than",
     "kind": "days",
     "default": 7,
     "min": 1,
     "max": 30
    },
    {
     "key": "review.audit_rate",
     "label": "Auto decisions sampled for audit",
     "kind": "pct",
     "default": 0.1,
     "min": 0.05,
     "max": 0.5
    },
    {
     "key": "review.audit_min",
     "label": "Smallest audit sample",
     "kind": "int",
     "default": 2,
     "min": 1,
     "max": 10
    }
   ]
  },
  {
   "id": "ladder",
   "title": "Autonomy",
   "note": "Checked at every research run: a changed threshold can move a class the next morning, and a lower ceiling drops it at once.",
   "fields": [
    {
     "key": "ladder.ceiling",
     "label": "Highest stage any class may reach",
     "kind": "int",
     "default": 3,
     "min": 0,
     "max": 3,
     "help": "0 shadow · 1 auto-reject · 2 auto-approve to significance 3 · 3 steady"
    },
    {
     "key": "ladder.stage1_calls",
     "label": "Auto-reject: reject predictions in the class",
     "kind": "int",
     "default": 10,
     "min": 10,
     "max": 100
    },
    {
     "key": "ladder.stage1_agreement",
     "label": "Auto-reject: share of them right",
     "kind": "pct",
     "default": 0.9,
     "min": 0.8,
     "max": 1.0
    },
    {
     "key": "ladder.stage2_approve_calls",
     "label": "Auto-approve: approve predictions in the class",
     "kind": "int",
     "default": 20,
     "min": 5,
     "max": 50
    },
    {
     "key": "ladder.stage2_agreement",
     "label": "Auto-approve: share of them right",
     "kind": "pct",
     "default": 0.95,
     "min": 0.8,
     "max": 1.0
    },
    {
     "key": "ladder.replay_size",
     "label": "Eval replay: past calls replayed",
     "kind": "int",
     "default": 20,
     "min": 10,
     "max": 50
    },
    {
     "key": "ladder.replay_pass",
     "label": "Eval replay: share that must agree",
     "kind": "pct",
     "default": 0.85,
     "min": 0.8,
     "max": 1.0

          var id = "ceil-" + k.replace(/[^a-z0-9]/gi, "-"), saved = savedCeilings()[k];

            h("label", { for: id, text: classLabel(k) }),
            h("select", { id: id, disabled: ro || busy, onchange: function (ev) { S.ceilDraft[k] = ev.target.value; render(); } },
              [["", "No own ceiling"], ["0", "0 · " + stageName(0)], ["1", "1 · " + stageName(1)], ["2", "2 · " + stageName(2)], ["3", "3 · " + stageName(3)]].map(function (o) {
                var el = h("option", { value: o[0], text: o[1] }); if (cur === o[0]) el.selected = true; return el; })),
            h("small", { title: k, text: "highest stage for this class" + (changed ? " · changed, not saved" : "") })), "ceil-" + k, [cur, changed, ro, busy]));
        });
        panel.appendChild(h("h4", { class: "sub", text: "Highest stage per class" }));
        panel.appendChild(classes.length ? cgrid : h("p", { class: "note", text: "Classes appear once the vault has beats." }));
        panel.appendChild(h("p", { class: "note", text: "Conflicts always come to you and take no ceiling." }));
      }
      m.appendChild(panel);
    });
    var slug = (S.vault && S.vault.slug) || "<slug>";
    var nc = nextCommit();
    m.appendChild(h("section", { class: "panel settings" }, h("h3", { text: "Schedule · read only" }),
      h("p", { class: "note", text: (S.vault && S.vault.schedule) ? String(S.vault.schedule)
        : "Default times: research run daily 02:40 · commit " + commitTimes().join(" and ") + " · brief Fri 13:20 · freshness check Sun 03:10." }),
      nc ? h("p", { class: "note", text: "Next commit: " + clock(nc) + " your time." }) : null,
      h("p", { class: "note", text: "Times are set on the vault's routines (vault-" + slug + "-curate and the others), not on this page." })));
    var n = e.edits.length + e.ceil.length;

      h("span", { class: "note", text: barText }),
      h("div", { class: "btns" },
        h("button", { class: "link", disabled: busy || (!n && !e.invalid && !Object.keys(S.cfgDraft).length), onclick: function () { S.cfgDraft = {}; S.ceilDraft = {}; S.cfgReset = null; render(); } }, "Discard"),
        h("button", { class: "primary", disabled: busy || !!e.invalid || !n || !S.me, onclick: saveSettings }, "Save as version " + (cfgVersion() + 1)))),
      "savebar", [barText, n, e.invalid, busy, !!S.me, cfgVersion(), Object.keys(S.cfgDraft).length]));
    m.appendChild(h("h2", { text: "Change log" }));
    var log = S.configChanges.slice().sort(function (a, b) { return (Number(b.version) || 0) - (Number(a.version) || 0); });
    if (!log.length) { m.appendChild(h("p", { class: "lede", text: "Each save adds a line here and a Config episode in the vault's memory at the next commit." })); return; }
    resolveNames(log.map(function (c) { return c.by; }));
    m.appendChild(keyed(h("ul", { class: "list changelog" }, log.slice(0, 30).map(function (c) {

      if (c.reset) parts.push("reset " + c.reset + " to defaults");
      return h("li", null, h("span", { class: "mono", text: "v" + (c.version || "?") }),
        h("span", null, (c.at ? day(c.at) + " · " : "") + (parts.join("; ") || "no changes") + " · " + ((c.by && S.names[c.by]) || "someone with edit access"),
          c.committed_episode ? h("span", { class: "chip good", text: "in memory" }) : h("span", { class: "chip", text: "waiting for commit" })));
    })), "changelog", [log.slice(0, 30), S.names]));
  }

  // ---------- render ----------
  var VIEWS = { inbox: viewInbox, summary: viewSummary, reviewer: viewReviewer, settings: viewSettings, steer: viewSteer, archive: viewArchive };
  function route() {
    var raw = (location.hash || "").slice(1);
    try { raw = decodeURIComponent(raw); } catch (e) {}
    if (LEGACY[raw]) raw = LEGACY[raw];
    var cut = raw.indexOf("/"), tab = cut < 0 ? raw : raw.slice(0, cut), arg = cut < 0 ? "" : raw.slice(cut + 1);
    return VIEWS[tab] ? { tab: tab, arg: arg } : { tab: "inbox", arg: "" };
  }
  function renderTabs() {
    var counts = { inbox: openItems().length }, cur = route().tab;
    var nav = document.getElementById("tabs"), next = document.createElement("nav");
    TABS.forEach(function (t) {
      var n = counts[t[0]];
      next.appendChild(keyed(h("a", { href: "#" + t[0], "aria-current": cur === t[0] ? "page" : null }, t[1], n ? h("span", { class: "count hot", text: n }) : null),
        "tab-" + t[0], [n || 0, cur === t[0]]));
    });
    morph(nav, next);
  }
  function renderMast() {
    var v = S.vault || {}, nc = S.ready ? nextCommit() : null;
    document.getElementById("vault-name").textContent = v.name ? v.name + " · Console" : "Vault Console";
    document.getElementById("vault-group").textContent = v.group_id || "";
    var last = S.runs[0];
    document.getElementById("runline").textContent = S.noDb ? "This view can't reach the Console data."
      : !S.ready ? "Connecting to the Console data…"
      : (last ? "Last run: " + routineLabel(last.routine) + " · " + when(last.started) : "No routine has run yet.") + (nc ? " · Next commit " + clock(nc) : "");
  }
  function render() {
    var active = document.activeElement, aid = active && active.id, sel = null;
    if (aid && typeof active.selectionStart === "number") try { sel = [active.selectionStart, active.selectionEnd]; } catch (e) {}
    renderMast(); renderTabs();
    var m = document.getElementById("main"), next = document.createElement("main"), r = route();
    if (S.stale) next.appendChild(keyed(h("div", { class: "banner", text: "The Console data can't be reached right now" + (S.staleWhy ? " (" + S.staleWhy + ")" : "") + ". What you see may be out of date." }), "stale", "1"));
    if (S.readOnly) next.appendChild(keyed(h("div", { class: "banner info", text: "You can view this Console but not change it." }), "readonly", "1"));
    if (S.noDb) next.appendChild(keyed(emptyState("The Console data isn't available in this view.", "Open the Console from claude.ai while signed in to review rows."), "nodb", "1"));
    else VIEWS[r.tab](next, r.arg);
    morph(m, next);
    var want = S.focusNext; S.focusNext = null;
    if (want) { var w = document.getElementById(want); if (w) { w.focus(); return; } }
    if (aid && document.activeElement !== active) {
      var el = document.getElementById(aid);
      if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
    }
  }
  // Settings fields update their own state while you type, a quarter second after the last key.
  render.soft = function () {
    clearTimeout(render.soft.t);
    render.soft.t = setTimeout(render, 250);
  };
  var lastTab = route().tab;
  window.addEventListener("hashchange", function () {
    var r = route();
    // Changing tabs lets cards you decided go; their Undo stays in the toast for its five seconds.
    if (r.tab !== lastTab) Object.keys(S.done).forEach(function (id) { if (!S.busy[id]) delete S.done[id]; });
    lastTab = r.tab;
    render();
    var target = /^row-/.test(r.arg) ? document.getElementById(r.arg) : null;
    if (target) {
      target.scrollIntoView({ block: "center" }); target.classList.add("hl");
      setTimeout(function () { target.classList.remove("hl"); }, 2400);
    } else window.scrollTo(0, 0);
  });
  // Once a minute: the next commit time, and Inbox rows whose revisit date has come.
  setInterval(render, 60000);

  // ---------- data ----------
  function subscribe(db) {
    var pending = 10, timer = setTimeout(function () { if (!S.ready) { S.stale = true; render(); } }, 10000);
    function landed(meta) {
      if (meta && meta.fromCache) return;
      if (!S.ready && --pending <= 0) { S.ready = true; S.stale = false; clearTimeout(timer); }
    }
    function fail(what) {
      return function (e) {
        console.error("live read of " + what + " failed" + (e && e.code ? " (" + e.code + ")" : ""), e);
        if (e && e.code === "revoked") S.readOnly = true;
        if (e && e.code && e.code !== "unavailable") S.staleWhy = what + ": " + e.code;
        S.stale = true; clearTimeout(timer); render();
      };
    }
    function rows(snap) { return snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; }); }
    var seen = {};
    // Snapshots arrive together on load; one redraw for a burst of them is enough.

    function soon() { if (queued) return; queued = true; setTimeout(function () { queued = false; render(); }, 16); }
    function q(name, query, key) {
      query.onSnapshot(function (snap) { S[key] = rows(snap); if (!seen[name] && !snap.metadata.fromCache) { seen[name] = 1; landed(snap.metadata); } soon(); }, fail(name));
    }
    function d(path, key) {
      db.doc(path).onSnapshot(function (snap) { S[key] = snap.exists ? snap.data() : null; if (!seen[path] && !snap.metadata.fromCache) { seen[path] = 1; landed(snap.metadata); } soon(); }, fail(path));
    }
    q("findings", db.collection("findings").orderBy("created", "desc").limit(600), "findings");
    q("steering", db.collection("steering").orderBy("at", "desc").limit(200), "steering");
    q("briefs", db.collection("briefs").orderBy("week", "desc").limit(26), "briefs");
    q("runs", db.collection("runs").orderBy("started", "desc").limit(120), "runs");
    q("config_changes", db.collection("config_changes").orderBy("version", "desc").limit(30), "configChanges");
    q("calibrations", db.collection("calibrations").orderBy("week", "desc").limit(26), "calibrations");
    d("meta/vault", "vault"); d("meta/charter", "charter"); d("meta/reviewer", "reviewer"); d("meta/config", "config");
  }

  render();
  var cl = window.claude;
  if (!cl || typeof cl.use !== "function") { S.noDb = true; render(); return; }
  cl.use("db").then(function (db) {
    if (!db) { S.noDb = true; render(); return; }
    S.db = db; subscribe(db);
    return cl.use("user").then(function (u) {
      if (!u || typeof u.can !== "function") { S.idKnown = true; render(); return; }

      // Settings live under meta, which only the owner and Editors (admin) may write.

    }, function () { S.idKnown = true; render(); });
  }, function () { S.noDb = true; render(); });
})();
