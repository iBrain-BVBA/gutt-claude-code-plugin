name: CI

on:
  push:
    branches: [main, master, release/3.0]
  pull_request:
    branches: [main, master, release/3.0]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check no file is committed as a symlink (Windows-safe packaging)
        run: npm run check:no-symlinks

      - name: Check runtime-state location (R37)
        run: npm run check:state

      - name: Check version sync (plugin.json ↔ package.json)
        run: npm run check:version

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Report the Node version under test
        run: node --version

      - name: Run unit tests
        run: npm test

      - name: Run hook smoke tests
        run: node tests/test-all-hooks.cjs

  # The toolchain version above is ours. Hooks are not: Claude Code spawns them
  # with whatever `node` the end user has on PATH, which is routinely older than
  # what we develop against. So the hook entry points get smoke-tested on the
  # oldest runtime we are willing to have a user on, to catch syntax or API that
  # only exists in a newer Node before it reaches someone's session as a broken
  # hook. Zero-dep by design, so this needs no install and stays fast.
  hook-runtime-compat:
    name: Hook Runtime Compat (Node 18)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run hook smoke tests on the end-user runtime floor
        run: node tests/test-all-hooks.cjs

  # The symlink guard reads the git index, which is platform-independent by design — but
  # that makes it a proxy for a defect only Windows produces, run only where the defect
  # cannot occur. This is the direct check: git on Windows defaults to core.symlinks=false
  # and writes a link's target path as the file's contents, so a committed symlink reaches
  # this job as a lib full of "../../../shared/debug.cjs" and every hook dies parsing it.
  # Spawning the hook entry points is what surfaces that. Zero-dep, so no install needed.
  hook-windows-smoke:
    name: Hook Smoke (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Run hook smoke tests on a Windows checkout
        run: node tests/test-all-hooks.cjs

  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
